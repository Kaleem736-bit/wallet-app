<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محفظة إلكترونية</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f0f0;
      margin: 0;
      padding: 0;
    }
    .container {
      margin-top: 100px;
    }
    h1 {
      color: #333;
    }
    .button {
      padding: 10px 20px;
      margin: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
    }
    .button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>مرحبًا بك في المحفظة الإلكترونية</h1>
    <p>تسجيل الدخول أو إنشاء حساب جديد</p>
    <button class="button" onclick="alert('تسجيل الدخول')">تسجيل الدخول</button>
    <button class="button" onclick="alert('التسجيل')">التسجيل</button>
  </div>
</body>
</html>
